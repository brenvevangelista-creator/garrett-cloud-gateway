_config_version: 47
agent:
  max_turns: 60
  reasoning_effort: medium
  verbose: false
browser:
  cloud_provider: nous
  inactivity_timeout: 120
  use_real_profile: true
code_execution:
  max_tool_calls: 50
  timeout: 300
compression:
  enabled: true
  protect_first_n: 3
  protect_last_n: 20
  target_ratio: 0.2
  threshold: 0.5
delegation:
  max_iterations: 50
display:
  background_process_notifications: all
  bell_on_complete: false
  busy_ack_detail: true
  busy_input_mode: interrupt
  cleanup_progress: false
  compact: false
  interim_assistant_messages: true
  long_running_notifications: true
  show_reasoning: false
  streaming: true
  tool_progress: all
group_sessions_per_user: true
image_gen:
  provider: nous
memory:
  flush_min_turns: 6
  memory_char_limit: 2200
  memory_enabled: true
  nudge_interval: 10
  user_char_limit: 1375
  user_profile_enabled: true
model:
  default: deepseek/deepseek-v4-pro
  provider: nous
platform_toolsets:
  cli:
    - hermes-cli
  discord:
    - hermes-discord
  google_chat:
    - hermes-google_chat
  homeassistant:
    - hermes-homeassistant
  qqbot:
    - hermes-qqbot
  signal:
    - hermes-signal
  slack:
    - hermes-slack
  teams:
    - hermes-teams
  telegram:
    - hermes-telegram
  whatsapp:
    - hermes-whatsapp
  yuanbao:
    - hermes-yuanbao
prompt_caching:
  cache_ttl: 5m
session_reset:
  at_hour: 4
  idle_minutes: 1440
  mode: both
skills:
  creation_nudge_interval: 15
streaming:
  enabled: true
stt:
  enabled: true
  provider: nous
terminal:
  backend: local
  cwd: .
  home_mode: auto
  lifetime_seconds: 300
  timeout: 180
tool_loop_guardrails:
  hard_stop_after:
    exact_failure: 5
    idempotent_no_progress: 5
    same_tool_failure: 8
  hard_stop_enabled: false
  warn_after:
    exact_failure: 2
    idempotent_no_progress: 2
    same_tool_failure: 3
  warnings_enabled: true
toolsets:
  - hermes-cli
  - web
tts:
  provider: nous
web:
  backend: nous
voice:
  voice_chat_mode: chained
wake_word:
  enabled: false
security:
  allow_private_urls: true
approvals:
  mode: manual
platforms:
  telegram:
    enabled: true
