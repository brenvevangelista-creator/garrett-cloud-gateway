# Render Blueprint — Garrett Cloud Gateway (full Hermes on the cloud)
#
# NOTE: Deployed via the Render API (not dashboard), but this file documents
# the exact shape so the deployment is reproducible. Secrets (Nous auth,
# Telegram token) are set as env vars — never stored here or in git.

services:
  - type: worker                # background worker: no port, runs continuously
    name: garrett-cloud-gateway
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # dockerCommand OVERRIDES the image ENTRYPOINT on Render (it runs this
    # command directly as PID 1, ignoring ENTRYPOINT/CMD). Omit it and Render
    # runs the Dockerfile CMD (`gateway run`) bare — skipping the bootstrap.
    # So we explicitly run the entrypoint script, which does the stage2 config
    # seed + NOUS_API_KEY persist + memory seed, then execs `gateway run`.
    dockerCommand: /opt/hermes/garrett-entrypoint.sh
    plan: standard              # 2 GB — gateway spikes past 512 MB in conversation
    region: oregon
    autoDeploy: true
    branch: main
    disk:
      name: garrett-data
      mountPath: /opt/data      # HERMES_HOME — persistent brain (memories, sessions, skills)
      sizeGB: 10
    envVars:
      - key: HERMES_GATEWAY_BOOTSTRAP_STATE
        value: running          # auto-start gateway on first boot
      # Secrets — set via API, never in this file:
      #   NOUS_API_KEY              (static Nous Portal API key, sk-nous-…)
      #   TELEGRAM_BOT_TOKEN        (= GARRETT_BOT_TOKEN value → @Garrett_assistant_bot)
      #   TELEGRAM_ALLOWED_USERS    (comma-separated numeric Telegram user IDs)
